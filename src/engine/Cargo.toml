[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/winsearch/winsearch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IndexServer",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
quick-xml = "0.37"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

ws-protocol = { path = "crates/ws-protocol" }
ws-platform = { path = "crates/ws-platform" }
ws-index = { path = "crates/ws-index" }
ws-modelmgr = { path = "crates/ws-modelmgr" }
ws-embed = { path = "crates/ws-embed" }
ws-embed-protocol = { path = "crates/ws-embed-protocol" }
ws-extract = { path = "crates/ws-extract" }
ws-code = { path = "crates/ws-code" }
ignore = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
