name: Engine verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows ${{ matrix.suite }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [contracts, lint, test, release]
    env:
      WS_EMBED_NO_CUDA: '1'
      WS_EMBED_NO_VULKAN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned Rust toolchain
        working-directory: src/engine
        shell: pwsh
        run: rustup show
      - name: Record toolchain
        working-directory: src/engine
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version
          dotnet --info
          python --version
      - name: Verify
        shell: pwsh
        run: ./tools/verify-engine.ps1 -Suite '${{ matrix.suite }}' -ReportDirectory ./artifacts/ci
      - name: Retain checks and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/ci
          if-no-files-found: error
